<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="piano">

  <!-- WHITE KEYS -->
  <div class="key white" data-key="KeyQ"><span>Q</span></div>
  <div class="key white" data-key="KeyW"><span>W</span></div>
  <div class="key white" data-key="KeyE"><span>E</span></div>
  <div class="key white" data-key="KeyR"><span>R</span></div>
  <div class="key white" data-key="KeyT"><span>T</span></div>
  <div class="key white" data-key="KeyY"><span>Y</span></div>
  <div class="key white" data-key="KeyU"><span>U</span></div>
  <div class="key white" data-key="KeyI"><span>I</span></div>
  <div class="key white" data-key="KeyO"><span>O</span></div>
  <div class="key white" data-key="KeyP"><span>P</span></div>

  <!-- BLACK KEYS -->
  <div class="key black b1" data-key="Digit2"><span>2</span></div>
  <div class="key black b2" data-key="Digit3"><span>3</span></div>
  <div class="key black b3" data-key="Digit5"><span>5</span></div>
  <div class="key black b4" data-key="Digit6"><span>6</span></div>
  <div class="key black b5" data-key="Digit7"><span>7</span></div>
  <div class="key black b6" data-key="Digit9"><span>9</span></div>
  <div class="key black b7" data-key="Digit0"><span>0</span></div>

</div>

<script src="script.js"></script>
</body>
</html>
